<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Smart Gate Controller</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            /* Pastel Sky Palette - dari gambar */
            --sky-blue: #A8CFEC;
            --blush-pink: #E8B4CB;
            --lavender: #C4A8D4;
            --soft-purple: #B09AC8;
            --star-white: #F0EEFF;

            --bg-grad-top: #A8CEED;
            --bg-grad-mid: #D9B0CC;
            --bg-grad-bot: #BFA8D8;

            --card-bg: rgba(255, 248, 255, 0.80);
            --primary: #8B6DB0;
            --primary-glow: rgba(139, 109, 176, 0.25);
            --green-main: #70B8A8;
            --green-bg: rgba(112, 184, 168, 0.15);
            --red-main: #D98BA0;
            --red-bg: rgba(217, 139, 160, 0.15);
            --text-main: #4A3A6B;
            --text-muted: #9C8AB5;
        }

        /* Stars */
        @keyframes twinkle {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.3); }
        }

        .stars {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle ease-in-out infinite;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(175deg,
                var(--bg-grad-top) 0%,
                var(--bg-grad-mid) 50%,
                var(--bg-grad-bot) 100%);
            color: var(--text-main);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            min-height: 100dvh;
            box-sizing: border-box;
            background-attachment: fixed;
            overflow-x: hidden;
            position: relative;
        }

        .app-container {
            width: 100%;
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            position: relative;
            box-sizing: border-box;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            transition: all 0.3s ease;
            z-index: 1;
        }

        /* --- HEADER --- */
        .header {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .lock-icon-container {
            border-radius: 50%;
            background: linear-gradient(135deg, var(--soft-purple), var(--blush-pink));
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 10px 25px var(--primary-glow);
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-6px); }
            100% { transform: translateY(0px); }
        }

        .lock-icon-container i { color: white; }

        h1 {
            font-weight: 700;
            margin: 0;
            color: var(--text-main);
            letter-spacing: -0.5px;
        }

        .subtitle {
            color: var(--text-muted);
            letter-spacing: 2px;
            font-weight: 600;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            background: linear-gradient(135deg, rgba(112,184,168,0.2), rgba(168,206,237,0.2));
            color: var(--green-main);
            border-radius: 50px;
            font-weight: 600;
            border: 1px solid rgba(112,184,168,0.3);
            box-shadow: 0 4px 12px rgba(112,184,168,0.15);
        }

        .status-badge .dot {
            border-radius: 50%;
            background-color: var(--green-main);
            box-shadow: 0 0 8px var(--green-main);
        }

        /* --- COMMAND CARDS --- */
        .section-title {
            color: var(--text-muted);
            letter-spacing: 1.5px;
            margin-top: 0;
            font-weight: 600;
            text-align: center;
        }

        .cards-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
        }

        .cmd-card {
            background: rgba(255, 250, 255, 0.75);
            border-radius: 20px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 24px rgba(139, 109, 176, 0.08);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            border: 1.5px solid rgba(196, 168, 212, 0.3);
            backdrop-filter: blur(10px);
        }

        .cmd-card:hover { transform: translateY(-5px); box-shadow: 0 15px 30px rgba(139, 109, 176, 0.15); }
        .cmd-card.green { border-color: rgba(112, 184, 168, 0.4); }
        .cmd-card.red { border-color: rgba(217, 139, 160, 0.4); }
        .cmd-card.green i { background: linear-gradient(135deg, rgba(112,184,168,0.2), rgba(168,206,237,0.2)); color: var(--green-main); }
        .cmd-card.red i { background: linear-gradient(135deg, rgba(217,139,160,0.2), rgba(196,168,212,0.2)); color: var(--red-main); }

        .cmd-card .title { font-weight: 700; margin: 0; color: var(--text-main); }
        .cmd-card .desc { color: var(--text-muted); font-weight: 500; }

        /* --- MIC SECTION --- */
        .mic-section {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .btn-mic {
            border-radius: 50%;
            background: linear-gradient(135deg, var(--soft-purple), var(--blush-pink));
            border: none;
            color: white;
            cursor: pointer;
            box-shadow: 0 15px 35px var(--primary-glow);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .btn-mic:active { transform: scale(0.95); }

        .btn-mic.recording {
            background: linear-gradient(135deg, var(--red-main), #E8A0B8);
            animation: pulse-record 1.5s infinite;
        }

        @keyframes pulse-record {
            0% { box-shadow: 0 0 0 0 rgba(217, 139, 160, 0.5); }
            70% { box-shadow: 0 0 0 25px rgba(217, 139, 160, 0); }
            100% { box-shadow: 0 0 0 0 rgba(217, 139, 160, 0); }
        }

        .mic-text { color: var(--primary); font-weight: 600; }
        .dots { color: var(--blush-pink); letter-spacing: 3px; line-height: 10px; opacity: 0.6; margin: 0; }

        /* --- STATUS BAR --- */
        .status-bar {
            background: rgba(255, 250, 255, 0.75);
            border-radius: 16px;
            display: flex;
            align-items: center;
            font-weight: 500;
            color: var(--text-main);
            box-shadow: 0 5px 15px rgba(139, 109, 176, 0.06);
            border: 1px solid rgba(196, 168, 212, 0.3);
            text-align: left;
            backdrop-filter: blur(10px);
        }

        .status-bar .dot-small {
            background-color: #CBD5E1;
            border-radius: 50%;
            flex-shrink: 0;
            transition: background-color 0.3s;
        }

        .nav-link {
            text-align: center;
            display: block;
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 500;
            background: rgba(255, 250, 255, 0.5);
            border-radius: 12px;
            transition: background-color 0.3s;
            border: 1px solid rgba(196, 168, 212, 0.2);
        }

        .nav-link:hover { background-color: rgba(255, 250, 255, 0.8); }

        /* =========================================
           MEDIA QUERIES - HP (Max 768px)
           ========================================= */
        @media (max-width: 768px) {
            body { overflow: hidden; }
            .app-container {
                padding: 20px;
                justify-content: space-between;
            }
            .header { margin-bottom: 5px; }
            .lock-icon-container { width: 60px; height: 60px; margin-bottom: 10px; }
            .lock-icon-container i { font-size: 22px; }
            h1 { font-size: 22px; }
            .subtitle { font-size: 10px; margin-top: 2px; margin-bottom: 8px; }
            .status-badge { gap: 6px; padding: 4px 12px; font-size: 11px; }
            .status-badge .dot { width: 6px; height: 6px; }

            .command-section {
                background: rgba(255, 250, 255, 0.65);
                border-radius: 25px;
                padding: 15px;
                flex-grow: 1;
                display: flex;
                flex-direction: column;
                justify-content: space-evenly;
                box-shadow: 0 10px 30px rgba(139, 109, 176, 0.08);
                border: 1px solid rgba(196, 168, 212, 0.35);
                margin: 10px 0;
                backdrop-filter: blur(12px);
            }

            .section-title { font-size: 11px; margin-bottom: 0px; }
            .cards-grid { gap: 10px; }
            .cmd-card { padding: 12px 5px; gap: 6px; }
            .cmd-card i { font-size: 18px; padding: 8px; border-radius: 10px; }
            .cmd-card .title { font-size: 13px; }
            .cmd-card .desc { font-size: 10px; }

            .btn-mic { width: 65px; height: 65px; font-size: 24px; margin-bottom: 8px; }
            .mic-text { font-size: 12px; margin-bottom: 0px; }
            .dots { font-size: 16px; margin-top: 5px; }

            .status-bar { padding: 12px 15px; gap: 10px; font-size: 11px; }
            .status-bar .dot-small { width: 8px; height: 8px; }

            .nav-link { margin-top: 0px; padding: 10px; font-size: 12px; }
        }

        /* =========================================
           MEDIA QUERIES - LAPTOP (Min 769px)
           ========================================= */
        @media (min-width: 769px) {
            body { padding: 40px; overflow: auto; }
            .app-container {
                max-width: 1000px;
                height: auto;
                min-height: 85vh;
                background: rgba(255, 250, 255, 0.70);
                border-radius: 40px;
                padding: 50px 80px;
                box-shadow: 0 30px 60px rgba(139, 109, 176, 0.15);
                border: 1px solid rgba(255, 255, 255, 0.6);
                display: flex;
                flex-direction: column;
                align-items: stretch;
                backdrop-filter: blur(20px);
            }
            .header { margin-bottom: 40px; }
            .lock-icon-container { width: 100px; height: 100px; margin-bottom: 25px; }
            .lock-icon-container i { font-size: 40px; }
            h1 { font-size: 50px; }
            .subtitle { font-size: 14px; margin-top: 5px; margin-bottom: 20px; }
            .status-badge { gap: 8px; padding: 8px 20px; font-size: 15px; }
            .status-badge .dot { width: 10px; height: 10px; }

            .command-section { padding: 0; background: transparent; }
            .section-title { font-size: 15px; margin-bottom: 25px; }

            .cards-grid { gap: 30px; }
            .cmd-card { padding: 30px 15px; gap: 15px; }
            .cmd-card i { font-size: 40px; padding: 15px; border-radius: 15px; }
            .cmd-card .title { font-size: 20px; }
            .cmd-card .desc { font-size: 16px; }

            .mic-section { margin-top: 50px; margin-bottom: 40px; }
            .btn-mic { width: 120px; height: 120px; font-size: 45px; margin-bottom: 25px; }
            .mic-text { font-size: 20px; margin-bottom: 5px; }
            .dots { font-size: 26px; margin-bottom: 15px; }

            .status-bar { padding: 25px; gap: 15px; font-size: 16px; margin-bottom: 20px; }
            .status-bar .dot-small { width: 14px; height: 14px; }

            .nav-link { margin-top: auto; padding: 18px; font-size: 16px; }
        }
    </style>
</head>
<body>

    <!-- Bintang-bintang -->
    <div class="stars" id="stars"></div>

    <div class="app-container">
        <div class="header">
            <div class="lock-icon-container">
                <i class="fa-solid fa-house"></i>
            </div>
            <h1>Smart Gate</h1>
            <div class="subtitle">VOICE BIOMETRIC SECURITY</div>
            <div class="status-badge">
                <span class="dot"></span> Sistem aktif
            </div>
        </div>

        <div class="command-section">
            <h3 class="section-title">PERINTAH SUARA TERSEDIA</h3>
            <div class="cards-grid">
                <div class="cmd-card green">
                    <i class="fa-solid fa-door-open"></i>
                    <p class="title">Buka pagar</p>
                    <span class="desc">Akses masuk</span>
                </div>
                <div class="cmd-card red">
                    <i class="fa-solid fa-door-closed"></i>
                    <p class="title">Tutup pagar</p>
                    <span class="desc">Kunci kembali</span>
                </div>
            </div>

            <div class="mic-section">
                <button id="btnCommand" class="btn-mic">
                    <i class="fa-solid fa-microphone"></i>
                </button>
                <div id="mic-text" class="mic-text">Ketuk untuk merekam</div>
                <div class="dots">.......</div>
            </div>

            <div class="status-bar">
                <span id="status-dot" class="dot-small"></span>
                <span id="status">Sistem siap. Ketuk mikrofon untuk memulai.</span>
            </div>
        </div>

        <a href="/trainer" class="nav-link"><i class="fa-solid fa-fingerprint"></i> Setup Suara Baru (Trainer)</a>
<a href="/logout" class="nav-link" style="margin-top: 8px; color: var(--red-main); border-color: rgba(139, 109, 176, 0.15);"><i class="fa-solid fa-right-from-bracket"></i> Logout</a>
    </div>

    <script>
        // Generate bintang
        const starsContainer = document.getElementById('stars');
        const starCount = 60;
        for (let i = 0; i < starCount; i++) {
            const star = document.createElement('div');
            star.classList.add('star');
            const size = Math.random() * 3 + 1;
            star.style.cssText = `
                width: ${size}px;
                height: ${size}px;
                top: ${Math.random() * 100}%;
                left: ${Math.random() * 100}%;
                animation-duration: ${Math.random() * 3 + 2}s;
                animation-delay: ${Math.random() * 3}s;
                opacity: ${Math.random() * 0.5 + 0.2};
            `;
            starsContainer.appendChild(star);
        }

        // Mic logic
        let mediaRecorder;
        let audioChunks = [];
        const btnCommand = document.getElementById('btnCommand');
        const statusText = document.getElementById('status');
        const micText = document.getElementById('mic-text');
        const statusDot = document.getElementById('status-dot');

        btnCommand.onclick = async () => {
            if (mediaRecorder && mediaRecorder.state === "recording") {
                mediaRecorder.stop();
                btnCommand.classList.remove("recording");
                btnCommand.innerHTML = '<i class="fa-solid fa-microphone"></i>';
                micText.innerText = "Ketuk untuk merekam";
                micText.style.color = "var(--primary)";
                return;
            }

            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            mediaRecorder = new MediaRecorder(stream);

            mediaRecorder.ondataavailable = e => audioChunks.push(e.data);

            mediaRecorder.onstop = async () => {
                const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                const formData = new FormData();
                formData.append('audio', audioBlob, 'command.webm');

                statusText.innerText = "Memverifikasi sidik suara...";
                statusDot.style.backgroundColor = "#D9B0CC";

                try {
                    const response = await fetch('/api/command', { method: 'POST', body: formData });
                    const result = await response.json();

                    statusText.innerText = result.msg;
                    if (result.status === "success") {
                        statusDot.style.backgroundColor = "var(--green-main)";
                    } else {
                        statusDot.style.backgroundColor = "var(--red-main)";
                    }
                } catch (error) {
                    statusText.innerText = "Gagal menghubungi server.";
                    statusDot.style.backgroundColor = "var(--red-main)";
                }

                audioChunks = [];
            };

            mediaRecorder.start();
            btnCommand.classList.add("recording");
            btnCommand.innerHTML = '<i class="fa-solid fa-stop"></i>';
            micText.innerText = "Merekam suara...";
            micText.style.color = "var(--red-main)";

            statusText.innerText = "Mendengarkan... Ucapkan perintah dengan jelas.";
            statusDot.style.backgroundColor = "var(--soft-purple)";
        };
    </script>
</body>
</html>
